name: pos | staging
description: ''
enabled: true
scopes:
- - label:
      app: pos
  - label:
      env: staging
rules:
- name: 'payment,prod,db → db : postgresql, postgresql (extra-scope)'
  enabled: true
  consumers:
  - label:
      app: payment
  - label:
      env: prod
  - label:
      role: db
  providers:
  - label:
      role: db
  services:
  - name: postgresql
    port: 5432
    proto: udp
  - name: postgresql
    port: 5432
    proto: tcp
  unscoped_consumers: true
- name: 'All Workloads → All Workloads : All Services'
  enabled: true
  consumers:
  - actors: ams
  providers:
  - actors: ams
  services:
  - name: All Services
    proto: '-1'
