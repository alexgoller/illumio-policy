name: ad | prod
description: null
enabled: true
scopes:
- - label:
      app: ad
  - label:
      env: prod
rules:
- name: 'All Workloads → All Workloads : All Services'
  enabled: true
  consumers:
  - actors: ams
  providers:
  - actors: ams
  services:
  - name: All Services
- name: 'exchange,prod,mailserver → dc : smb, high-tcp-ports, ldap, dns, kerberoauth,
    MSFT Domain Controllers, ntp (extra-scope)'
  enabled: true
  consumers:
  - label:
      app: exchange
  - label:
      env: prod
  - label:
      role: mailserver
  providers:
  - label:
      role: dc
  services:
  - name: smb
  - name: high-tcp-ports
  - name: ldap
  - name: dns
  - name: kerberoauth
  - name: MSFT Domain Controllers
  - name: ntp
  unscoped_consumers: true
- name: 'exchange,prod,edgetransport → dc : ldap, high-tcp-ports, dns, smb, ntp, kerberoauth,
    MSFT Domain Controllers (extra-scope)'
  enabled: true
  consumers:
  - label:
      app: exchange
  - label:
      env: prod
  - label:
      role: edgetransport
  providers:
  - label:
      role: dc
  services:
  - name: ldap
  - name: high-tcp-ports
  - name: dns
  - name: smb
  - name: ntp
  - name: kerberoauth
  - name: MSFT Domain Controllers
  unscoped_consumers: true
