name: ad | prod
description: ''
enabled: true
scopes:
- - label:
      app: ad
  - label:
      env: prod
rules:
- name: 'laptop,users,employee → dc : kerberoauth, kerberoauth (extra-scope)'
  enabled: true
  consumers:
  - label:
      app: laptop
  - label:
      env: users
  - label:
      role: employee
  providers:
  - label:
      role: dc
  services:
  - name: kerberoauth
    port: 88
    proto: udp
  - name: kerberoauth
    port: 88
    proto: tcp
  unscoped_consumers: true
- name: 'All Workloads → All Workloads : All Services'
  enabled: true
  consumers:
  - actors: ams
  providers:
  - actors: ams
  services:
  - name: All Services
    proto: '-1'
- name: 'exchange,prod,mailserver → dc : smb, smb, high-tcp-ports, ldap, ldap, dns,
    dns, kerberoauth, kerberoauth, MSFT Domain Controllers, ntp, ntp (extra-scope)'
  enabled: true
  consumers:
  - label:
      app: exchange
  - label:
      env: prod
  - label:
      role: mailserver
  providers:
  - label:
      role: dc
  services:
  - name: smb
    port: 445
    proto: tcp
  - name: smb
    port: 445
    proto: udp
  - name: high-tcp-ports
    port: 49152
    to_port: 65535
    proto: tcp
  - name: ldap
    port: 389
    proto: tcp
  - name: ldap
    port: 389
    proto: udp
  - name: dns
    port: 53
    proto: tcp
  - name: dns
    port: 53
    proto: udp
  - name: kerberoauth
    port: 88
    proto: udp
  - name: kerberoauth
    port: 88
    proto: tcp
  - name: MSFT Domain Controllers
    port: 135
    proto: tcp
  - name: ntp
    port: 123
    proto: tcp
  - name: ntp
    port: 123
    proto: udp
  unscoped_consumers: true
- name: 'exchange,prod,edgetransport → dc : ldap, ldap, high-tcp-ports, dns, dns,
    smb, smb, ntp, ntp, kerberoauth, kerberoauth, MSFT Domain Controllers (extra-scope)'
  enabled: true
  consumers:
  - label:
      app: exchange
  - label:
      env: prod
  - label:
      role: edgetransport
  providers:
  - label:
      role: dc
  services:
  - name: ldap
    port: 389
    proto: tcp
  - name: ldap
    port: 389
    proto: udp
  - name: high-tcp-ports
    port: 49152
    to_port: 65535
    proto: tcp
  - name: dns
    port: 53
    proto: tcp
  - name: dns
    port: 53
    proto: udp
  - name: smb
    port: 445
    proto: tcp
  - name: smb
    port: 445
    proto: udp
  - name: ntp
    port: 123
    proto: tcp
  - name: ntp
    port: 123
    proto: udp
  - name: kerberoauth
    port: 88
    proto: udp
  - name: kerberoauth
    port: 88
    proto: tcp
  - name: MSFT Domain Controllers
    port: 135
    proto: tcp
  unscoped_consumers: true
