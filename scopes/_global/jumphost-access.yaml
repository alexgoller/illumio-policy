name: Jumphost Access
description: ''
enabled: true
scopes: []
rules:
- name: 'jump-infra,prod,jumpbox → All Workloads,Any (0.0.0.0/0 and ::/0) : ssh, ssh,
    rdp, rdp'
  enabled: true
  consumers:
  - label:
      app: jump-infra
  - label:
      env: prod
  - label:
      role: jumpbox
  providers:
  - actors: ams
  - ip_list:
      name: Any (0.0.0.0/0 and ::/0)
  services:
  - name: ssh
    port: 22
    proto: udp
  - name: ssh
    port: 22
    proto: tcp
  - name: rdp
    port: 3389
    proto: udp
  - name: rdp
    port: 3389
    proto: tcp
