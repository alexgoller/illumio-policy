      role: syslog
  - label:
      app: soc
  services:
  - name: syslog
    port: 514
    proto: udp
  - name: syslog
    port: 514
    proto: tcp
- name: 'All Workloads → syslog,soc : syslog, syslog'
  enabled: true
  consumers:
  - actors: ams
