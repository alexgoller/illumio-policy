      role: nagios
  - label:
      app: monitoring
  providers:
  - actors: ams
  services:
  - name: nagios
    port: 5666
    proto: tcp
deny_rules:
- name: 'laptop → label-group : https'
  enabled: true
  consumers:
  - label:
      app: laptop
  providers:
  - label_group:
      name: All my business apps
  services:
  - name: https
    port: 443
    proto: tcp
  type: deny
