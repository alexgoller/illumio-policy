name: coreservices
description: ''
enabled: true
scopes: []
rules:
- name: 'All Workloads → time : ntp, ntp'
  enabled: true
  consumers:
  - actors: ams
  providers:
  - label:
      role: time
  services:
  - name: ntp
    port: 123
    proto: tcp
  - name: ntp
    port: 123
    proto: udp
- name: 'All Workloads → time : ntp, ntp'
  enabled: true
  consumers:
  - actors: ams
  providers:
  - label:
      role: time
  services:
  - name: ntp
    port: 123
    proto: tcp
  - name: ntp
    port: 123
    proto: udp
- name: 'All Workloads → syslog,soc : syslog, syslog'
  enabled: true
  consumers:
  - actors: ams
  providers:
