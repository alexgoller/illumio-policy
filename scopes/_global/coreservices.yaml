name: coreservices
description: ''
enabled: true
scopes: []
rules:
- name: 'All Workloads → time : ntp'
  enabled: true
  consumers:
  - actors: ams
  providers:
  - label:
      role: time
  services:
  - name: ntp
- name: 'All Workloads → syslog,soc : syslog'
  enabled: true
  consumers:
  - actors: ams
  providers:
  - label:
      role: syslog
  - label:
      app: soc
  services:
  - name: syslog
- name: 'nagios,monitoring → All Workloads : nagios'
  enabled: true
  consumers:
  - label:
      role: nagios
  - label:
      app: monitoring
  providers:
  - actors: ams
  services:
  - name: nagios
deny_rules:
- name: 'laptop → label-group : https'
  enabled: true
  consumers:
  - label:
      app: laptop
  providers:
  - label_group:
      href: /orgs/1/sec_policy/active/label_groups/f05e1114-4975-481c-9bc1-a34444e53718
  services:
  - name: https
  type: deny
